name: Publish the docs

# Builds the site and publishes it to GitHub Pages. Pages must be turned on
# in the repository settings with "GitHub Actions" as the source; until it
# is, the deploy job fails and nothing is published.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The site has its own domain (docs.hikari-index.moe, set in the
      # repository's Pages settings), so it is served from the root. A
      # project-page address would need BASE_PATH: /hikari-index-docs.
      - run: npm run build
        env:
          BASE_PATH: ""
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
